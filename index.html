<!DOCTYPE html>
<html lang="fr" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Petits Jeux">
<link rel="apple-touch-icon" href="icon.png">
<title>Petits Jeux</title>
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 500; font-style: normal;
    src: url(fonts/fredoka-latin-500-normal.woff2) format('woff2'), url(fonts/fredoka-latin-500-normal.woff) format('woff'); }
  @font-face { font-family: 'Fredoka'; font-weight: 600; font-style: normal;
    src: url(fonts/fredoka-latin-600-normal.woff2) format('woff2'), url(fonts/fredoka-latin-600-normal.woff) format('woff'); }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #fff8ec; color: #3d2c4f;
    font-family: 'Fredoka', 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-text-size-adjust: none;
  }
  * { box-sizing: border-box; -webkit-box-sizing: border-box; }
  img { -webkit-touch-callout: none; -webkit-user-drag: none; pointer-events: none; display: block; }
  svg { display: block; }

  .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; overflow: hidden; }
  .screen.on { display: block; }
  .row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .grow { -webkit-flex: 1; flex: 1; min-width: 0; }

  /* ---------- Buttons ---------- */
  .btn {
    display: -webkit-inline-flex; display: inline-flex; -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    height: 72px; padding: 0 30px; border-radius: 36px; font-size: 26px; font-weight: 600;
    background: #f1ebfa; color: #5b3f86; margin: 6px;
    -webkit-box-shadow: 0 5px 0 rgba(61,44,79,0.12); box-shadow: 0 5px 0 rgba(61,44,79,0.12);
  }
  .btn svg { width: 30px; height: 30px; margin-right: 10px; }
  .btn.primary { background: #ff5d8f; color: #fff; -webkit-box-shadow: 0 5px 0 #d23c6c; box-shadow: 0 5px 0 #d23c6c; }
  .btn:active, .ib:active, .chip:active, .gcard:active, .tile:active, .press:active {
    -webkit-transform: scale(0.94) translateY(2px); transform: scale(0.94) translateY(2px);
  }
  .ib {
    width: 66px; height: 66px; border-radius: 33px; background: #f1ebfa; color: #5b3f86;
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center; -webkit-flex-shrink: 0; flex-shrink: 0;
    font-size: 36px; font-weight: 600; margin-left: 10px;
    -webkit-box-shadow: 0 4px 0 rgba(61,44,79,0.12); box-shadow: 0 4px 0 rgba(61,44,79,0.12);
  }
  .ib svg { width: 34px; height: 34px; }
  .ib.first { margin-left: 0; }

  /* ---------- Start screen ---------- */
  #start { background: #ffc857; background-image: linear-gradient(160deg, #ffd56b 0%, #ff9e7a 100%); text-align: center; }
  #start .deco { position: absolute; -webkit-animation: floaty 4s ease-in-out infinite; animation: floaty 4s ease-in-out infinite; opacity: 0.95; }
  @-webkit-keyframes floaty { 0%,100% { -webkit-transform: translateY(0) rotate(-6deg); } 50% { -webkit-transform: translateY(-18px) rotate(6deg); } }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-18px) rotate(6deg); } }
  #startInner { position: absolute; left: 0; right: 0; top: 50%; -webkit-transform: translateY(-55%); transform: translateY(-55%); }
  #appTitle { font-size: 76px; font-weight: 600; color: #fff; text-shadow: 0 5px 0 rgba(160,60,40,0.35); line-height: 1.1; }
  #appSub { font-size: 26px; color: #7a3b22; margin-top: 8px; }
  #playBtn {
    width: 200px; height: 200px; border-radius: 100px; margin: 36px auto 0; background: #ff5d8f; position: relative;
    -webkit-box-shadow: 0 12px 0 #c93a69, 0 0 0 14px rgba(255,255,255,0.35); box-shadow: 0 12px 0 #c93a69, 0 0 0 14px rgba(255,255,255,0.35);
    -webkit-animation: pulse 1.8s ease-in-out infinite; animation: pulse 1.8s ease-in-out infinite;
  }
  #playBtn svg { position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; margin: -48px 0 0 -40px; }
  @-webkit-keyframes pulse { 0%,100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.06); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  #langs { position: absolute; left: 0; right: 0; bottom: 70px; }
  .lang { display: inline-block; margin: 0 6px; padding: 12px 22px; border-radius: 26px; background: rgba(255,255,255,0.45); font-size: 22px; color: #7a3b22; }
  .lang.sel { background: #fff; font-weight: 600; }
  #soundHint { position: absolute; left: 20px; right: 20px; bottom: 22px; font-size: 16px; color: #7a3b22; opacity: 0.85; }

  /* ---------- Top bars ---------- */
  .bar {
    position: absolute; top: 0; left: 0; right: 0; height: 96px; padding: 12px 16px 0;
    background: #fff; -webkit-box-shadow: 0 4px 0 rgba(61,44,79,0.06); box-shadow: 0 4px 0 rgba(61,44,79,0.06); z-index: 20;
  }
  .bar .row { height: 72px; }
  .bar-icon { width: 58px; height: 58px; border-radius: 18px; margin: 0 14px 0 14px; position: relative; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .bar-title { font-size: 30px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1; }
  .bar-sub { font-size: 17px; color: #8a7a9b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .info { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 24px; font-weight: 600; margin-left: 8px; }
  .levels { display: -webkit-flex; display: flex; margin-left: 10px; background: #f6f2fb; border-radius: 30px; padding: 5px; }
  .chip {
    min-width: 50px; height: 50px; border-radius: 25px; margin: 0 2px; font-size: 24px; font-weight: 600; color: #8a7a9b;
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
  }
  .chip.sel { color: #fff; -webkit-box-shadow: 0 3px 0 rgba(0,0,0,0.15); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  .stage { position: absolute; top: 96px; left: 0; right: 0; bottom: 0; overflow: hidden; }

  /* ---------- Menu ---------- */
  #menu { background: #fff8ec; }
  .gcard { position: absolute; border-radius: 34px; background: #fff; overflow: hidden;
    -webkit-box-shadow: 0 8px 0 rgba(61,44,79,0.08); box-shadow: 0 8px 0 rgba(61,44,79,0.08); }
  .gcard .art { position: absolute; left: 0; right: 0; top: 0; overflow: hidden; }
  .gcard .art .ring { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.25); }
  .gcard .txt { position: absolute; left: 22px; right: 22px; bottom: 16px; }
  .gcard .t { font-size: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gcard .s { font-size: 18px; color: #8a7a9b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stars { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-top: 6px; font-size: 18px; color: #c79a1e; font-weight: 600; }
  .stars svg { width: 22px; height: 22px; margin-right: 4px; }

  /* ---------- Overlay sheets ---------- */
  #overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(40,28,60,0.5); z-index: 100; display: none; }
  #overlay.on { display: block; }
  #sheet {
    position: absolute; left: 50%; top: 50%; width: 640px; max-width: 92%; background: #fff; border-radius: 40px;
    padding: 34px 34px 26px; text-align: center;
    -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%);
    -webkit-animation: popin 0.35s ease-out; animation: popin 0.35s ease-out;
  }
  @-webkit-keyframes popin { from { -webkit-transform: translate(-50%, -50%) scale(0.7); opacity: 0; } to { -webkit-transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  @keyframes popin { from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .sh-icon { width: 110px; height: 110px; border-radius: 34px; margin: -90px auto 12px; position: relative;
    -webkit-box-shadow: 0 6px 0 rgba(0,0,0,0.12); box-shadow: 0 6px 0 rgba(0,0,0,0.12); }
  #sheet h2 { margin: 0; font-size: 38px; font-weight: 600; }
  #sheet .sub { font-size: 20px; color: #8a7a9b; margin-top: 4px; }
  .steps { text-align: left; margin: 22px 0 18px; }
  .step { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; margin: 12px 0; font-size: 22px; line-height: 1.3; }
  .step .num { width: 40px; height: 40px; border-radius: 20px; color: #fff; font-weight: 600; text-align: center; line-height: 40px; margin-right: 14px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .step span { padding-top: 6px; }
  .bigstars { display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center; margin: 18px 0 22px; }
  .bigstars svg { width: 86px; height: 86px; margin: 0 8px; opacity: 0; -webkit-animation: starpop 0.5s ease-out forwards; animation: starpop 0.5s ease-out forwards; }
  @-webkit-keyframes starpop { 0% { -webkit-transform: scale(0) rotate(-40deg); opacity: 0; } 70% { -webkit-transform: scale(1.25) rotate(10deg); opacity: 1; } 100% { -webkit-transform: scale(1); opacity: 1; } }
  @keyframes starpop { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 70% { transform: scale(1.25) rotate(10deg); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .langbtn { display: block; height: 76px; line-height: 76px; border-radius: 38px; font-size: 28px; font-weight: 600; background: #f6f2fb; margin: 12px 0; }
  .langbtn.sel { background: #ff5d8f; color: #fff; }

  /* ---------- Shared game pieces ---------- */
  .tile { position: absolute; border-radius: 30px; background: #fff;
    -webkit-box-shadow: 0 7px 0 rgba(61,44,79,0.1); box-shadow: 0 7px 0 rgba(61,44,79,0.1); }
  .tile .cap { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 20px; font-weight: 600; color: #6b5a7d; white-space: nowrap; overflow: hidden; }
  .tile.good { -webkit-box-shadow: 0 0 0 8px #4cd17f, 0 7px 0 rgba(61,44,79,0.1); box-shadow: 0 0 0 8px #4cd17f, 0 7px 0 rgba(61,44,79,0.1); }
  .bounce { -webkit-animation: bounce 0.6s ease; animation: bounce 0.6s ease; }
  @-webkit-keyframes bounce { 0%{-webkit-transform:scale(1)} 30%{-webkit-transform:scale(1.15) rotate(-6deg)} 60%{-webkit-transform:scale(0.96) rotate(4deg)} 100%{-webkit-transform:scale(1)} }
  @keyframes bounce { 0%{transform:scale(1)} 30%{transform:scale(1.15) rotate(-6deg)} 60%{transform:scale(0.96) rotate(4deg)} 100%{transform:scale(1)} }
  .shake { -webkit-animation: shake 0.5s ease; animation: shake 0.5s ease; }
  @-webkit-keyframes shake { 0%,100%{-webkit-transform:translateX(0)} 20%{-webkit-transform:translateX(-14px)} 40%{-webkit-transform:translateX(12px)} 60%{-webkit-transform:translateX(-8px)} 80%{-webkit-transform:translateX(5px)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-14px)} 40%{transform:translateX(12px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(5px)} }
  .dots { display: -webkit-flex; display: flex; margin-left: 10px; }
  .dot { width: 22px; height: 22px; border-radius: 11px; margin: 0 3px; background: #ece5f5; }
  .counter { background: #f6f2fb; border-radius: 26px; padding: 8px 18px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; white-space: nowrap; }
  .counter img { width: 32px; height: 32px; margin-right: 8px; }

  /* Bubbles */
  .bub { position: absolute; left: 0; top: 0; border-radius: 50%; border: 4px solid rgba(255,255,255,0.7); }
  .bub .shine { position: absolute; width: 26%; height: 26%; left: 18%; top: 14%; border-radius: 50%; background: rgba(255,255,255,0.85); }
  .bub.wobble { -webkit-animation: shake 0.4s ease; animation: shake 0.4s ease; }
  .bit { position: absolute; width: 18px; height: 18px; border-radius: 9px; -webkit-transition: all 0.5s ease-out; transition: all 0.5s ease-out; }

  /* Paint */
  .toolbar { position: absolute; left: 0; right: 0; bottom: 0; height: 112px; background: #fff; padding: 0 12px;
    -webkit-box-shadow: 0 -4px 0 rgba(61,44,79,0.06); box-shadow: 0 -4px 0 rgba(61,44,79,0.06);
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
  .sw { width: 66px; height: 66px; border-radius: 33px; margin: 0 5px; border: 5px solid #fff; position: relative; -webkit-flex-shrink: 0; flex-shrink: 0;
    -webkit-box-shadow: 0 0 0 2px #ece5f5; box-shadow: 0 0 0 2px #ece5f5; }
  .sw.sel { -webkit-box-shadow: 0 0 0 5px #3d2c4f; box-shadow: 0 0 0 5px #3d2c4f; }
  .sep { width: 2px; height: 60px; background: #ece5f5; margin: 0 10px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .sizedot { position: absolute; left: 50%; top: 50%; border-radius: 50%; background: #3d2c4f; }
  .stamp { position: absolute; -webkit-animation: stampin 0.3s ease-out; animation: stampin 0.3s ease-out; }
  @-webkit-keyframes stampin { from { -webkit-transform: scale(0); } to { -webkit-transform: scale(1); } }
  @keyframes stampin { from { transform: scale(0); } to { transform: scale(1); } }

  /* Peekaboo */
  .slot { position: absolute; overflow: hidden; border-radius: 36px; background: #fff;
    -webkit-box-shadow: 0 7px 0 rgba(61,44,79,0.1); box-shadow: 0 7px 0 rgba(61,44,79,0.1); }
  .blanket { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 36px;
    -webkit-transition: -webkit-transform 0.5s ease; transition: transform 0.5s ease; }
  .blanket .face { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 60px; background: rgba(255,255,255,0.3);
    font-size: 80px; line-height: 120px; text-align: center; color: #fff; font-weight: 600; }
  .blanket.open { -webkit-transform: translateY(105%); transform: translateY(105%); }

  /* Piano */
  .key { position: absolute; top: 0; bottom: 0; border-radius: 0 0 30px 30px; border-right: 3px solid #fff8ec; }
  .key .gloss { position: absolute; left: 10%; right: 10%; top: 0; height: 40%; border-radius: 0 0 24px 24px; background: rgba(255,255,255,0.18); }
  .key.down { -webkit-filter: brightness(1.25); filter: brightness(1.25); }
  .key.glow { -webkit-box-shadow: inset 0 0 0 10px #fff; box-shadow: inset 0 0 0 10px #fff; }
  .key .hint { position: absolute; left: 50%; bottom: 40px; width: 70px; height: 70px; margin-left: -35px;
    -webkit-animation: pulse 0.9s ease-in-out infinite; animation: pulse 0.9s ease-in-out infinite; }
  .note { position: absolute; pointer-events: none; -webkit-animation: floatUp 1.2s ease-out forwards; animation: floatUp 1.2s ease-out forwards; }
  @-webkit-keyframes floatUp { from { -webkit-transform: translateY(0); opacity: 1; } to { -webkit-transform: translateY(-240px); opacity: 0; } }
  @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-240px); opacity: 0; } }
  .progress { width: 160px; height: 18px; border-radius: 9px; background: #ece5f5; overflow: hidden; margin-left: 12px; }
  .progress div { height: 100%; border-radius: 9px; -webkit-transition: width 0.3s; transition: width 0.3s; }

  /* Memory */
  .card { position: absolute; border-radius: 26px;
    -webkit-transition: -webkit-transform 0.18s ease-in; transition: transform 0.18s ease-in;
    -webkit-box-shadow: 0 7px 0 rgba(61,44,79,0.12); box-shadow: 0 7px 0 rgba(61,44,79,0.12); }
  .card.back-side { background-color: #8f6bea;
    background-image: radial-gradient(circle, rgba(255,255,255,0.22) 20%, transparent 21%);
    background-size: 40px 40px; }
  .card.back-side svg { position: absolute; left: 50%; top: 50%; width: 40%; height: 40%; -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%); }
  .card.face { background: #fff; }
  .card.flip { -webkit-transform: scaleX(0); transform: scaleX(0); }
  .card.found { -webkit-box-shadow: 0 0 0 6px #4cd17f, 0 7px 0 rgba(61,44,79,0.12); box-shadow: 0 0 0 6px #4cd17f, 0 7px 0 rgba(61,44,79,0.12); }
  /* Narrow screens (iPad held upright) */
  @media (max-width: 900px) {
    .bar { padding: 12px 10px 0; }
    .bar-icon { display: none; }
    .bar .grow { margin-left: 12px; }
    .bar-title { font-size: 22px; }
    .bar-sub { font-size: 14px; }
    .ib { width: 58px; height: 58px; margin-left: 6px; }
    .chip { min-width: 44px; height: 44px; font-size: 20px; }
    .dot { width: 14px; height: 14px; margin: 0 2px; }
    .progress { width: 90px; }
    .counter { padding: 8px 12px; font-size: 20px; }
  }
</style>
</head>
<body>

<div id="start" class="screen on">
  <div id="startInner">
    <div id="appTitle"></div>
    <div id="appSub"></div>
    <div id="playBtn"></div>
  </div>
  <div id="langs">
    <span class="lang" data-lang="fr">Français</span>
    <span class="lang" data-lang="en">English</span>
    <span class="lang" data-lang="de">Deutsch</span>
    <span class="lang" data-lang="ru">Русский</span>
  </div>
  <div id="soundHint"></div>
</div>

<div id="menu" class="screen">
  <div class="bar"><div class="row">
    <div class="ib first" id="menuHome"></div>
    <div class="bar-icon" id="menuLogo"></div>
    <div class="grow"><div class="bar-title" id="menuTitle"></div><div class="bar-sub" id="menuSub"></div></div>
    <div class="ib" id="menuLang" style="width:auto;padding:0 20px;font-size:22px"></div>
  </div></div>
  <div class="stage" id="menuGrid"></div>
</div>

<div id="game" class="screen">
  <div class="bar"><div class="row">
    <div class="ib first" id="gBack"></div>
    <div class="bar-icon" id="gIcon"></div>
    <div class="grow"><div class="bar-title" id="gTitle"></div><div class="bar-sub" id="gSub"></div></div>
    <div class="info" id="gInfo"></div>
    <div class="levels" id="gLevels"></div>
    <div class="ib" id="gRestart"></div>
    <div class="ib" id="gHelp">?</div>
  </div></div>
  <div class="stage" id="stage"></div>
</div>

<div id="overlay"><div id="sheet"></div></div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
