<!DOCTYPE html>
<html lang="fr" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Petits Jeux">
<link rel="apple-touch-icon" href="icon.png">
<title>Petits Jeux</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #fff7e6;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-text-size-adjust: none;
  }
  .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; overflow: hidden; }
  .screen.on { display: block; }

  /* Start screen (for the parent) */
  #start { background: #ffd166; text-align: center; }
  #playBtn {
    position: absolute; left: 50%; top: 50%; width: 260px; height: 260px;
    margin: -150px 0 0 -130px; border-radius: 130px; background: #ef476f;
    color: #fff; font-size: 140px; line-height: 260px;
    -webkit-box-shadow: 0 12px 0 #b8304f; box-shadow: 0 12px 0 #b8304f;
  }
  #langs { position: absolute; left: 0; right: 0; bottom: 30px; }
  .lang {
    display: inline-block; margin: 0 8px; padding: 10px 20px; border-radius: 24px;
    background: rgba(255,255,255,0.6); font-size: 22px; color: #6b4e00;
  }
  .lang.sel { background: #fff; font-weight: bold; }

  /* Menu */
  #menu { background: #8ecae6; }
  .tile {
    position: absolute; border-radius: 40px; text-align: center; color: #fff;
    -webkit-box-shadow: 0 10px 0 rgba(0,0,0,0.18); box-shadow: 0 10px 0 rgba(0,0,0,0.18);
  }
  .tile span { position: absolute; left: 0; right: 0; top: 50%; margin-top: -0.6em; line-height: 1.2em; }
  .pressed { -webkit-transform: scale(0.92); transform: scale(0.92); }

  .back {
    position: absolute; top: 18px; left: 18px; width: 90px; height: 90px; border-radius: 45px;
    background: rgba(255,255,255,0.85); font-size: 54px; line-height: 90px; text-align: center;
    z-index: 10; color: #333;
  }

  /* Animals */
  #animals { background: #b7e4c7; }
  .animal { position: absolute; text-align: center; border-radius: 36px; background: rgba(255,255,255,0.55); }
  .animal span { position: absolute; left: 0; right: 0; top: 50%; line-height: 1.2em; margin-top: -0.6em; }
  .bounce { -webkit-animation: bounce 0.6s ease; animation: bounce 0.6s ease; }
  @-webkit-keyframes bounce { 0%{-webkit-transform:scale(1)} 30%{-webkit-transform:scale(1.25) rotate(-8deg)} 60%{-webkit-transform:scale(0.95) rotate(6deg)} 100%{-webkit-transform:scale(1)} }
  @keyframes bounce { 0%{transform:scale(1)} 30%{transform:scale(1.25) rotate(-8deg)} 60%{transform:scale(0.95) rotate(6deg)} 100%{transform:scale(1)} }

  /* Canvas games */
  canvas { position: absolute; top: 0; left: 0; display: block; }
  #bubbles { background: #a2d2ff; }
  #paint { background: #fff; }
  #paint .back { background: #eee; }
  #palette { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #f1f1f1; text-align: center; z-index: 5; }
  .swatch {
    display: inline-block; width: 84px; height: 84px; border-radius: 42px; margin: 18px 8px;
    border: 6px solid #fff; vertical-align: top;
  }
  .swatch.sel { border-color: #333; }
  .swatch.eraser { background: #fff; font-size: 48px; line-height: 84px; }

  /* Peekaboo */
  #peek { background: #ffc8dd; }
  #peekAnimal { position: absolute; left: 0; right: 0; text-align: center; }
  #blanket {
    position: absolute; border-radius: 40px; background: #9b5de5;
    -webkit-transition: -webkit-transform 0.5s ease; transition: transform 0.5s ease;
    background-image: -webkit-repeating-linear-gradient(45deg, #9b5de5, #9b5de5 30px, #b185f0 30px, #b185f0 60px);
    background-image: repeating-linear-gradient(45deg, #9b5de5, #9b5de5 30px, #b185f0 30px, #b185f0 60px);
  }
  #blanket.open { -webkit-transform: translateY(110%); transform: translateY(110%); }

  /* Piano */
  #piano { background: #222; }
  .key { position: absolute; top: 0; bottom: 0; border-right: 4px solid #222; }
  .key.down { opacity: 0.6; }
  .note { position: absolute; font-size: 70px; pointer-events: none;
    -webkit-animation: floatUp 1.2s ease-out forwards; animation: floatUp 1.2s ease-out forwards; }
  @-webkit-keyframes floatUp { from{-webkit-transform:translateY(0);opacity:1} to{-webkit-transform:translateY(-220px);opacity:0} }
  @keyframes floatUp { from{transform:translateY(0);opacity:1} to{transform:translateY(-220px);opacity:0} }

  /* Memory */
  #memory { background: #ffe5b4; }
  .card {
    position: absolute; border-radius: 30px; text-align: center;
    -webkit-transition: -webkit-transform 0.18s ease-in; transition: transform 0.18s ease-in;
    -webkit-box-shadow: 0 8px 0 rgba(0,0,0,0.15); box-shadow: 0 8px 0 rgba(0,0,0,0.15);
  }
  .card span { position: absolute; left: 0; right: 0; top: 50%; line-height: 1.2em; margin-top: -0.6em; }
  .card.back-side { background: #ff8fab;
    background-image: -webkit-radial-gradient(circle, #ffb3c6 22%, transparent 23%);
    background-image: radial-gradient(circle, #ffb3c6 22%, transparent 23%);
    background-size: 46px 46px; }
  .card.face { background: #fff; }
  .card.flip { -webkit-transform: scaleX(0); transform: scaleX(0); }
  .card.found { opacity: 0.55; }
  .card.wiggle { -webkit-animation: bounce 0.6s ease; animation: bounce 0.6s ease; }
</style>
</head>
<body>

<div id="start" class="screen on">
  <div id="playBtn">&#9654;</div>
  <div id="langs">
    <span class="lang" data-lang="fr">Français</span>
    <span class="lang" data-lang="en">English</span>
    <span class="lang" data-lang="de">Deutsch</span>
    <span class="lang" data-lang="ru">Русский</span>
  </div>
</div>

<div id="menu" class="screen"></div>

<div id="animals" class="screen"><div class="back">&#8592;</div></div>

<div id="bubbles" class="screen"><canvas id="bubbleCanvas"></canvas><div class="back">&#8592;</div></div>

<div id="paint" class="screen">
  <canvas id="paintCanvas"></canvas>
  <div id="palette"></div>
  <div class="back">&#8592;</div>
</div>

<div id="peek" class="screen">
  <div id="peekAnimal"></div>
  <div id="blanket"></div>
  <div class="back">&#8592;</div>
</div>

<div id="piano" class="screen"><div class="back">&#8592;</div></div>

<div id="memory" class="screen"><div class="back">&#8592;</div></div>

<script>
/* Written in plain ES5 on purpose: this runs on an iPad 3 (iOS 9.3, Safari 9). */
(function () {
  'use strict';

  // ---------- Words in each language ----------
  var WORDS = {
    fr: { cow: 'La vache. Meuh!', pig: 'Le cochon. Groin groin!', dog: 'Le chien. Ouaf ouaf!',
          cat: 'Le chat. Miaou!', sheep: 'Le mouton. Bêê!', chick: 'Le poussin. Piou piou!',
          frog: 'La grenouille. Coâ coâ!', lion: 'Le lion. Roaaar!', monkey: 'Le singe. Hou hou ha ha!',
          peek: 'Coucou!', hello: 'Coucou! On joue?', bravo: 'Bravo!',
          colors: ['Rouge', 'Orange', 'Jaune', 'Vert', 'Bleu', 'Violet', 'Rose', 'Marron'] },
    en: { cow: 'Cow. Moo!', pig: 'Pig. Oink oink!', dog: 'Dog. Woof woof!',
          cat: 'Cat. Meow!', sheep: 'Sheep. Baa!', chick: 'Chick. Cheep cheep!',
          frog: 'Frog. Ribbit!', lion: 'Lion. Roar!', monkey: 'Monkey. Ooh ooh ah ah!',
          peek: 'Peekaboo!', hello: 'Hello! Let\'s play!', bravo: 'Well done!',
          colors: ['Red', 'Orange', 'Yellow', 'Green', 'Blue', 'Purple', 'Pink', 'Brown'] },
    de: { cow: 'Die Kuh. Muh!', pig: 'Das Schwein. Grunz grunz!', dog: 'Der Hund. Wau wau!',
          cat: 'Die Katze. Miau!', sheep: 'Das Schaf. Mäh!', chick: 'Das Küken. Piep piep!',
          frog: 'Der Frosch. Quak quak!', lion: 'Der Löwe. Roaaar!', monkey: 'Der Affe. Uh uh ah ah!',
          peek: 'Kuckuck!', hello: 'Hallo! Spielen wir?', bravo: 'Super!',
          colors: ['Rot', 'Orange', 'Gelb', 'Grün', 'Blau', 'Lila', 'Rosa', 'Braun'] }
  };
  WORDS.ru = { cow: 'Корова. Му-у!', pig: 'Свинка. Хрю-хрю!', dog: 'Собачка. Гав-гав!',
          cat: 'Кошечка. Мяу!', sheep: 'Овечка. Бе-е!', chick: 'Цыплёнок. Пи-пи-пи!',
          frog: 'Лягушка. Ква-ква!', lion: 'Лев. Р-р-р!', monkey: 'Обезьянка. У-у-а-а!',
          peek: 'Ку-ку!', hello: 'Привет! Давай играть!', bravo: 'Молодец!',
          colors: ['Красный', 'Оранжевый', 'Жёлтый', 'Зелёный', 'Синий', 'Фиолетовый', 'Розовый', 'Коричневый'] };
  var VOICE_LANG = { fr: 'fr-FR', en: 'en-GB', de: 'de-DE', ru: 'ru-RU' };
  var lang = 'fr';
  try { lang = localStorage.getItem('lang') || 'fr'; } catch (e) {}
  if (!WORDS[lang]) { lang = 'fr'; }

  var ANIMALS = [
    { e: '🐮', k: 'cow',    f: 220 },
    { e: '🐷', k: 'pig',    f: 330 },
    { e: '🐶', k: 'dog',    f: 392 },
    { e: '🐱', k: 'cat',    f: 523 },
    { e: '🐑', k: 'sheep',  f: 294 },
    { e: '🐥', k: 'chick',  f: 660 },
    { e: '🐸', k: 'frog',   f: 196 },
    { e: '🦁', k: 'lion',   f: 147 },
    { e: '🐵', k: 'monkey', f: 440 }
  ];
  var COLORS = ['#e63946', '#f77f00', '#ffd60a', '#2a9d8f', '#277da1', '#7b2cbf', '#ff70a6', '#8d5524'];

  // ---------- Helpers ----------
  function $(id) { return document.getElementById(id); }
  function W() { return window.innerWidth; }
  function H() { return window.innerHeight; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function each(list, fn) { for (var i = 0; i < list.length; i++) { fn(list[i], i); } }

  // One-tap handler that works with touch (iPad) and mouse (computer).
  function onTap(el, fn) {
    el.addEventListener('touchstart', function (ev) { ev.preventDefault(); fn(ev.changedTouches[0], ev); }, false);
    el.addEventListener('mousedown', function (ev) { fn(ev, ev); }, false);
  }

  // Stop page scrolling, rubber-banding and zoom.
  document.addEventListener('touchmove', function (ev) { ev.preventDefault(); }, false);
  document.addEventListener('gesturestart', function (ev) { ev.preventDefault(); }, false);

  // ---------- Sound ----------
  var ctx = null;
  function unlockAudio() {
    if (ctx) { if (ctx.resume) { ctx.resume(); } return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { return; }
    ctx = new AC();
    // A silent sound on the first tap unlocks audio on iOS.
    var buf = ctx.createBuffer(1, 1, 22050);
    var src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    if (src.start) { src.start(0); } else { src.noteOn(0); }
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!ctx) { return; }
    var t = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) { o.frequency.exponentialRampToValueAtTime(slideTo, t + dur); }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    if (o.start) { o.start(t); o.stop(t + dur + 0.05); } else { o.noteOn(t); o.noteOff(t + dur + 0.05); }
  }
  function popSound() { tone(rand(500, 900), 0.12, 'sine', 0.4, 120); }
  function boing(f) { tone(f, 0.35, 'triangle', 0.35, f * 1.6); }

  function say(text) {
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) { return; }
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = VOICE_LANG[lang];
      u.rate = 0.9; u.pitch = 1.2;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- Screens ----------
  var current = 'start';
  var stopLoop = null;
  function show(name) {
    if (stopLoop) { stopLoop(); stopLoop = null; }
    $(current).className = 'screen';
    current = name;
    $(name).className = 'screen on';
    if (SETUP[name]) { SETUP[name](); }
  }
  each(document.querySelectorAll('.back'), function (b) {
    onTap(b, function () { tone(300, 0.1, 'sine', 0.2); show('menu'); });
  });

  // Start screen
  function markLang() {
    each(document.querySelectorAll('.lang'), function (el) {
      el.className = 'lang' + (el.getAttribute('data-lang') === lang ? ' sel' : '');
    });
  }
  markLang();
  each(document.querySelectorAll('.lang'), function (el) {
    onTap(el, function () {
      lang = el.getAttribute('data-lang');
      try { localStorage.setItem('lang', lang); } catch (e) {}
      markLang();
    });
  });
  onTap($('playBtn'), function () {
    unlockAudio();
    say(WORDS[lang].hello);
    show('menu');
  });

  // Lay out n boxes in a grid that fills the screen.
  function grid(n, top, gap, fixedCols) {
    var w = W(), h = H() - top;
    var cols = fixedCols || (w > h ? Math.ceil(Math.sqrt(n * 1.4)) : Math.ceil(Math.sqrt(n / 1.4)));
    var rows = Math.ceil(n / cols);
    var cw = (w - gap * (cols + 1)) / cols;
    var ch = (h - gap * (rows + 1)) / rows;
    var out = [];
    for (var i = 0; i < n; i++) {
      var c = i % cols, r = Math.floor(i / cols);
      out.push({ x: gap + c * (cw + gap), y: top + gap + r * (ch + gap), w: cw, h: ch });
    }
    return out;
  }
  function place(el, b) {
    el.style.left = b.x + 'px'; el.style.top = b.y + 'px';
    el.style.width = b.w + 'px'; el.style.height = b.h + 'px';
  }
  function flash(el, cls) {
    el.className = el.className.replace(' ' + cls, '');
    void el.offsetWidth; // restart CSS animation
    el.className += ' ' + cls;
  }

  // ---------- Menu ----------
  var GAMES = [
    { id: 'animals', icon: '🐮', color: '#2a9d8f' },
    { id: 'bubbles', icon: '🔵', color: '#277da1' },
    { id: 'paint',   icon: '🎨', color: '#f77f00' },
    { id: 'peek',    icon: '🙈', color: '#e63946' },
    { id: 'piano',   icon: '🎹', color: '#7b2cbf' },
    { id: 'memory',  icon: '🃏', color: '#ff70a6' }
  ];
  var SETUP = {};
  SETUP.menu = function () {
    var m = $('menu');
    m.innerHTML = '';
    var boxes = grid(GAMES.length, 0, 30);
    each(GAMES, function (g, i) {
      var t = document.createElement('div');
      t.className = 'tile';
      t.style.background = g.color;
      t.style.fontSize = Math.floor(Math.min(boxes[i].w, boxes[i].h) * 0.55) + 'px';
      t.innerHTML = '<span>' + g.icon + '</span>';
      place(t, boxes[i]);
      onTap(t, function () {
        t.className = 'tile pressed';
        boing(300 + i * 80);
        setTimeout(function () { show(g.id); }, 180);
      });
      m.appendChild(t);
    });
  };

  // ---------- Game 1: Animals ----------
  SETUP.animals = function () {
    var s = $('animals');
    each(s.querySelectorAll('.animal'), function (el) { s.removeChild(el); });
    var boxes = grid(ANIMALS.length, 110, 20);
    each(ANIMALS, function (a, i) {
      var el = document.createElement('div');
      el.className = 'animal';
      el.style.fontSize = Math.floor(Math.min(boxes[i].w, boxes[i].h) * 0.7) + 'px';
      el.innerHTML = '<span>' + a.e + '</span>';
      place(el, boxes[i]);
      onTap(el, function () {
        flash(el, 'bounce');
        boing(a.f);
        say(WORDS[lang][a.k]);
      });
      s.appendChild(el);
    });
  };

  // ---------- Game 2: Bubbles ----------
  function setupCanvas(cv) {
    var r = window.devicePixelRatio > 1 ? 2 : 1; // keep it light for an old iPad
    cv.width = W() * r; cv.height = H() * r;
    cv.style.width = W() + 'px'; cv.style.height = H() + 'px';
    var c = cv.getContext('2d');
    c.setTransform(r, 0, 0, r, 0, 0);
    return c;
  }
  SETUP.bubbles = function () {
    var cv = $('bubbleCanvas');
    var c = setupCanvas(cv);
    var list = [], bits = [], running = true, last = 0;
    function add() {
      var r = rand(50, 95);
      list.push({ x: rand(r, W() - r), y: H() + r, r: r, v: rand(40, 90),
                  col: COLORS[Math.floor(rand(0, COLORS.length))], w: rand(0, 6) });
    }
    for (var i = 0; i < 5; i++) { add(); list[i].y = rand(H() * 0.3, H()); }
    function frame(ts) {
      if (!running) { return; }
      var dt = last ? Math.min((ts - last) / 1000, 0.05) : 0.016; last = ts;
      c.clearRect(0, 0, W(), H());
      if (list.length < 7 && Math.random() < 0.03) { add(); }
      for (var i = list.length - 1; i >= 0; i--) {
        var b = list[i];
        b.y -= b.v * dt; b.w += dt * 2;
        var x = b.x + Math.sin(b.w) * 12;
        if (b.y < -b.r) { list.splice(i, 1); continue; }
        c.globalAlpha = 0.75; c.fillStyle = b.col;
        c.beginPath(); c.arc(x, b.y, b.r, 0, Math.PI * 2); c.fill();
        c.globalAlpha = 0.9; c.fillStyle = '#fff';
        c.beginPath(); c.arc(x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.18, 0, Math.PI * 2); c.fill();
        b.drawX = x;
      }
      for (var j = bits.length - 1; j >= 0; j--) {
        var p = bits[j];
        p.t -= dt; if (p.t <= 0) { bits.splice(j, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        c.globalAlpha = p.t / 0.6; c.fillStyle = p.col;
        c.beginPath(); c.arc(p.x, p.y, 10, 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    function hit(pt) {
      for (var i = list.length - 1; i >= 0; i--) {
        var b = list[i], dx = pt.clientX - (b.drawX || b.x), dy = pt.clientY - b.y;
        // Generous hit area: little fingers are not precise.
        if (dx * dx + dy * dy < (b.r + 30) * (b.r + 30)) {
          for (var k = 0; k < 8; k++) {
            var a = k / 8 * Math.PI * 2;
            bits.push({ x: b.drawX || b.x, y: b.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, t: 0.6, col: b.col });
          }
          list.splice(i, 1);
          popSound();
          return;
        }
      }
    }
    cv.ontouchstart = function (ev) {
      ev.preventDefault();
      for (var i = 0; i < ev.changedTouches.length; i++) { hit(ev.changedTouches[i]); }
    };
    cv.onmousedown = function (ev) { hit(ev); };
    requestAnimationFrame(frame);
    stopLoop = function () { running = false; };
  };

  // ---------- Game 3: Finger painting ----------
  var paintColor = COLORS[0];
  SETUP.paint = function () {
    var cv = $('paintCanvas');
    var c = setupCanvas(cv);
    c.lineCap = 'round'; c.lineJoin = 'round';
    var pal = $('palette');
    pal.innerHTML = '';
    var sw = [];
    each(COLORS.concat(['eraser']), function (col) {
      var d = document.createElement('div');
      d.className = 'swatch' + (col === 'eraser' ? ' eraser' : '');
      if (col === 'eraser') { d.innerHTML = '✖'; }
      else { d.style.background = col; }
      onTap(d, function () {
        if (col === 'eraser') {
          c.clearRect(0, 0, W(), H());
          tone(200, 0.3, 'sine', 0.3, 80);
          return;
        }
        paintColor = col;
        each(sw, function (x) { x.className = x.className.replace(' sel', ''); });
        d.className += ' sel';
        tone(500, 0.1, 'sine', 0.2);
        var idx = COLORS.indexOf(col);
        say(WORDS[lang].colors[idx]);
      });
      if (col === paintColor) { d.className += ' sel'; }
      sw.push(d);
      pal.appendChild(d);
    });
    var lastPts = {};
    function dot(id, x, y) {
      c.strokeStyle = paintColor; c.lineWidth = 34;
      c.beginPath();
      var p = lastPts[id];
      if (p) { c.moveTo(p.x, p.y); } else { c.moveTo(x - 0.1, y); }
      c.lineTo(x, y); c.stroke();
      lastPts[id] = { x: x, y: y };
    }
    cv.ontouchstart = cv.ontouchmove = function (ev) {
      ev.preventDefault();
      for (var i = 0; i < ev.changedTouches.length; i++) {
        var t = ev.changedTouches[i];
        if (ev.type === 'touchstart') { lastPts[t.identifier] = null; }
        dot(t.identifier, t.clientX, t.clientY);
      }
    };
    cv.ontouchend = cv.ontouchcancel = function (ev) {
      for (var i = 0; i < ev.changedTouches.length; i++) { lastPts[ev.changedTouches[i].identifier] = null; }
    };
    var mouseDown = false;
    cv.onmousedown = function (ev) { mouseDown = true; lastPts.m = null; dot('m', ev.clientX, ev.clientY); };
    cv.onmousemove = function (ev) { if (mouseDown) { dot('m', ev.clientX, ev.clientY); } };
    cv.onmouseup = function () { mouseDown = false; };
  };

  // ---------- Game 4: Peekaboo ----------
  SETUP.peek = function () {
    var an = $('peekAnimal'), bl = $('blanket');
    var size = Math.min(W(), H()) * 0.6;
    var box = { x: (W() - size * 1.2) / 2, y: (H() - size * 1.2) / 2, w: size * 1.2, h: size * 1.2 };
    an.style.top = (H() - size * 1.15) / 2 + 'px';
    an.style.fontSize = size + 'px';
    an.style.lineHeight = size * 1.15 + 'px';
    place(bl, box);
    var open = false, busy = false;
    function hide() {
      var a = ANIMALS[Math.floor(rand(0, ANIMALS.length))];
      an.innerHTML = a.e;
      an.setAttribute('data-k', a.k);
      bl.className = '';
      open = false;
    }
    hide();
    bl.ontouchstart = bl.onmousedown = null;
    $('peek').ontouchstart = function (ev) { ev.preventDefault(); tapPeek(); };
    $('peek').onmousedown = function () { tapPeek(); };
    function tapPeek() {
      if (busy) { return; }
      busy = true;
      if (!open) {
        bl.className = 'open'; open = true;
        tone(400, 0.25, 'triangle', 0.35, 900);
        say(WORDS[lang].peek);
        flash(an, 'bounce');
      } else {
        tone(500, 0.25, 'triangle', 0.3, 250);
        hide();
      }
      setTimeout(function () { busy = false; }, 600);
    }
    // The back button must not trigger the blanket.
    var back = $('peek').querySelector('.back');
    back.ontouchstart = function (ev) { ev.stopPropagation(); };
    back.onmousedown = function (ev) { ev.stopPropagation(); };
  };

  // ---------- Game 5: Rainbow piano ----------
  var NOTES = [262, 294, 330, 349, 392, 440, 494, 523];
  var NOTE_ICONS = ['♪', '♫', '⭐', '❤'];
  SETUP.piano = function () {
    var s = $('piano');
    each(s.querySelectorAll('.key'), function (el) { s.removeChild(el); });
    var kw = W() / NOTES.length;
    each(NOTES, function (f, i) {
      var k = document.createElement('div');
      k.className = 'key';
      k.style.left = i * kw + 'px'; k.style.width = kw + 'px';
      k.style.background = COLORS[i];
      k.ontouchstart = function (ev) {
        ev.preventDefault();
        for (var j = 0; j < ev.changedTouches.length; j++) { play(ev.changedTouches[j]); }
      };
      k.onmousedown = function (ev) { play(ev); };
      k.ontouchend = k.onmouseup = function () { k.className = 'key'; };
      function play(pt) {
        tone(f, 0.6, 'triangle', 0.4);
        k.className = 'key down';
        var n = document.createElement('div');
        n.className = 'note';
        n.innerHTML = NOTE_ICONS[Math.floor(rand(0, NOTE_ICONS.length))];
        n.style.color = '#fff';
        n.style.left = (pt.clientX - 30) + 'px';
        n.style.top = (pt.clientY - 60) + 'px';
        s.appendChild(n);
        setTimeout(function () { if (n.parentNode) { s.removeChild(n); } }, 1300);
        setTimeout(function () { k.className = 'key'; }, 250);
      }
      s.insertBefore(k, s.firstChild);
    });
  };

  // ---------- Game 6: Memory (find the pairs) ----------
  // Starts with 2 pairs; each win adds a pair, up to 4 pairs (8 cards).
  var memPairs = 2;
  SETUP.memory = function () {
    var s = $('memory');
    each(s.querySelectorAll('.card'), function (el) { s.removeChild(el); });

    // Pick random animals and make a shuffled deck of pairs.
    var pool = ANIMALS.slice(), deck = [], i, j, t;
    for (i = pool.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    for (i = 0; i < memPairs; i++) { deck.push(pool[i]); deck.push(pool[i]); }
    for (i = deck.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = deck[i]; deck[i] = deck[j]; deck[j] = t; }

    var landscape = W() > H();
    var boxes = grid(deck.length, 110, 26, landscape ? deck.length / 2 : 2);
    var open = [], found = 0, busy = false, myRound = {};
    s.round = myRound;

    function turn(card, faceUp) {
      card.className = card.className + ' flip';
      setTimeout(function () {
        card.className = 'card ' + (faceUp ? 'face' : 'back-side') + ' flip';
        card.innerHTML = faceUp ? '<span>' + card.animal.e + '</span>' : '';
        void card.offsetWidth;
        card.className = card.className.replace(' flip', '');
      }, 180);
    }

    each(deck, function (a, n) {
      var card = document.createElement('div');
      card.className = 'card back-side';
      card.animal = a;
      card.style.fontSize = Math.floor(Math.min(boxes[n].w, boxes[n].h) * 0.6) + 'px';
      place(card, boxes[n]);
      onTap(card, function () {
        if (busy || card.isOpen || card.isFound) { return; }
        card.isOpen = true;
        open.push(card);
        turn(card, true);
        tone(a.f * 2, 0.15, 'sine', 0.3);
        if (open.length < 2) { return; }

        busy = true;
        var c1 = open[0], c2 = open[1];
        open = [];
        if (c1.animal.k === c2.animal.k) {
          setTimeout(function () {
            c1.isFound = c2.isFound = true;
            c1.className = c2.className = 'card face found';
            flash(c1, 'wiggle'); flash(c2, 'wiggle');
            boing(a.f);
            say(WORDS[lang][a.k]);
            found++;
            busy = false;
            if (found === memPairs) { setTimeout(win, 1600); }
          }, 450);
        } else {
          setTimeout(function () {
            c1.isOpen = c2.isOpen = false;
            turn(c1, false); turn(c2, false);
            tone(330, 0.2, 'sine', 0.15, 260);
            busy = false;
          }, 1300);
        }
      });
      s.appendChild(card);
    });

    function win() {
      if (current !== 'memory' || s.round !== myRound) { return; }
      say(WORDS[lang].bravo);
      var notes = [523, 659, 784, 1047];
      each(notes, function (f, k) { setTimeout(function () { tone(f, 0.3, 'triangle', 0.35); }, k * 150); });
      each(s.querySelectorAll('.card'), function (c) { flash(c, 'wiggle'); });
      if (memPairs < 4) { memPairs++; }
      setTimeout(function () {
        if (current === 'memory' && s.round === myRound) { SETUP.memory(); }
      }, 2500);
    }
  };

  // Redraw the layout when the iPad is rotated.
  window.addEventListener('resize', function () {
    if (current !== 'start' && SETUP[current] && current !== 'paint') { show(current); }
  }, false);

  // Pick up new versions of the app when online.
  if (window.applicationCache) {
    window.applicationCache.addEventListener('updateready', function () {
      try { window.applicationCache.swapCache(); } catch (e) {}
      if (current === 'start') { location.reload(); }
    }, false);
  }
})();
</script>
</body>
