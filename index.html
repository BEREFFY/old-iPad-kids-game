<style>

  /* Big "listen" button inside the game area */

  .key.down { -webkit-filter: brightness(1.3); filter: brightness(1.3); }
  .key.dim { opacity: 0.28; }
  .key.glow { -webkit-box-shadow: inset 0 0 0 9px #fff, 0 0 30px 8px rgba(255,255,255,0.9); box-shadow: inset 0 0 0 9px #fff, 0 0 30px 8px rgba(255,255,255,0.9); z-index: 2; }
  .key .hand { position: absolute; left: 50%; top: 110px; width: 80px; height: 80px; margin-left: -40px;
    -webkit-animation: tapme 0.8s ease-in-out infinite; animation: tapme 0.8s ease-in-out infinite; }
  .key .hint { position: absolute; left: 50%; bottom: 50px; width: 70px; height: 70px; margin-left: -35px;
    -webkit-animation: pulse 0.8s ease-in-out infinite; animation: pulse 0.8s ease-in-out infinite; }
  @-webkit-keyframes tapme { 0%,100% { -webkit-transform: translateY(0); } 50% { -webkit-transform: translateY(26px); } }
  @keyframes tapme { 0%,100% { transform: translateY(0); } 50% { transform: translateY(26px); } }
  .note { position: absolute; pointer-events: none; -webkit-animation: floatUp 1.2s ease-out forwards; animation: floatUp 1.2s ease-out forwards; }
  @-webkit-keyframes floatUp { from { -webkit-transform: translateY(0); opacity: 1; } to { -webkit-transform: translateY(-240px); opacity: 0; } }
  @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-240px); opacity: 0; } }

  /* Memory */
  .card { position: absolute; border-radius: 26px; border: 5px solid #fff;
    -webkit-transition: -webkit-transform 0.18s ease-in; transition: transform 0.18s ease-in;
    -webkit-box-shadow: 0 7px 0 rgba(61,44,79,0.14); box-shadow: 0 7px 0 rgba(61,44,79,0.14); }
  .card.back-side { background-color: #8f6bea; background-image: linear-gradient(135deg, #a07cf5 0%, #ff7eb6 100%); }
  .card.back-side svg { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%); }
  .card.face { background: #fff; }
  .card.flip { -webkit-transform: scaleX(0); transform: scaleX(0); }
  .card.found { border-color: #4cd17f; }

  /* Narrow screens (iPad held upright) */
  @media (max-width: 900px) {
    .bar { padding: 11px 10px 0; }

  }
</style>
